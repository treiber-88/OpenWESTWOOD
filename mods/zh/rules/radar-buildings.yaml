# OpenWESTWOOD: the other games' radar buildings give their owner the radar (the mini-map), as Zero Hour's
# command centers do: the finished building grants itself Upgrade_OWRadar, which turns on a RadarUpgrade (it needs
# power, like the originals' radar). Merged into the factions' own object definitions.
Upgrades:
  Upgrade_OWRadar:
    Type: OBJECT
    BuildTime: 0.0
    BuildCost: 0
Objects:
  # Tiberian Dawn: the Communications Center and the Advanced Communications Center
  TDGDI_HQ:
    Modules:
      ModuleTag_OWRadarGrant:
        Module: Behavior
        Class: GrantUpgradeCreate
        UpgradeToGrant: Upgrade_OWRadar
        ExemptStatus: UNDER_CONSTRUCTION
      ModuleTag_OWRadar:
        Module: Behavior
        Class: RadarUpgrade
        TriggeredBy: Upgrade_OWRadar
  TDNOD_HQ:
