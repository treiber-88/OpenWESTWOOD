# OpenWESTWOOD: the Westwood games' own sidebars, from their original art (see TiberianDawn/SidebarSkin.cs for the
# fields). Positions are in the original screen's pixels, from the sidebar's top left; the sidebar is drawn to the
# screen's height at its right edge.
#
# Red Alert (the Windows hi-res sidebar, 640 x 400: SIDEBAR.CPP, RADAR.CPP, POWER.CPP, TAB.CPP): the side pieces
# SIDE1/2/3 (NA Allied, US Soviet), the strips STRIPNA/STRIPUS, the credits tab (TABS frame 6), the power bar.
#
# Tiberian Sun (each side's sidebar archive: GDI's SIDEC01.MIX, Nod's SIDEC02.MIX, in its SIDEBAR.PAL): the credits tab
# TABS, the radar RADAR (its first frame the side's emblem), the ADDON under it with the Repair / Sell / Power buttons,
# the strips' top SIDE1, a SIDE2 for each row of cameos and SIDE3 under them with the R-UP / R-DN scroll buttons.
#
# Red Alert 2 / Yuri's Revenge (SIDEC01.MIX the Allies', SIDEC02.MIX the Soviets', in their SIDEBAR.PAL): TOP, the
# CREDITS bar, the RADAR (its first frame the side's emblem), SIDE1 with the Repair / Sell buttons and the four tabs
# TAB00-03, a SIDE2 for each row of cameos (the power column at its right), SIDE3 with R-UP / R-DN, and the GCLOCK2 build
# clock. (Yuri's Revenge has no Yuri sidebar archive among the game's files here: Yuri uses the Soviets'.)
#
# Dune 2000 (its interface art, content/dune2000/mod/uibits/chrome.png): the credits bar, the radar's frame (the house
# insignia in it until there is a radar), the dark-slotted panel for each row of icons, the bottom bar, and the Repair /
# Sell / Power buttons (up and down, "a|b").
