# OpenWESTWOOD: each faction's flag or emblem, shown by its name in the skirmish lobby's army lists (LobbyFlag, an image
# name). Zero Hour's own factions use their SideIconImage. All from the original games' files:
#   Red Alert 2: the countries' flags (RA2PCX: the lobby pictures USAI.PCX ...); Red Alert: the Allied and Soviet
#   radar emblems (RASHAPE:NATORADR / USSRRADR); Tiberian Dawn: the score screen's GDI eagle and Nod scorpion (TDLOGO);
#   Tiberian Sun: the sidebar radar's emblems (TSEMBLEM); Dune 2000: the sidebar's house insignia (D2KCHROME);
#   Emperor: the houses' logos (EMCAMEO); Kane's Wrath: the factions' and sub-factions' logos (KWCAMEO).
# ("#u0,v0,u1,v1" after a name takes part of the picture: the logo from the middle of a panel or a radar frame.)
