# OpenGZH: the shell map behind the menus is a battle for Dune (see DuneShellBattle): the houses' bases on a
# Dune 2000 map, run by the computer, their armies fighting each other, with House Harkonnen's theme playing.
GameData:
  OpenGZHShellMap: d2k:tenaya
  # One house a start point (up to seven), every one against every other.
  OpenGZHShellHouses: FactionD2KAtreides FactionD2KHarkonnen FactionD2KOrdos FactionTDGDI FactionTDNod FactionRA2Russians FactionTSNod
  OpenGZHShellCash: 40000
  # Seconds played ahead before the menus show it, and the houses' first attack and attacks after that.
  OpenGZHShellPreroll: 150
  OpenGZHShellFirstAttack: 20
  OpenGZHShellAttackInterval: 25
  # The camera: how far back it sits, how long it stays on a spot once there, and its gliding speed (world units a second).
  OpenGZHShellCameraDistance: 800
  OpenGZHShellCameraHold: 10
  OpenGZHShellCameraSpeed: 220
  OpenGZHShellMusic: ShellDune

MusicTracks:
  ShellDune:
    Filename: /Music/HarkonnenTheme.mp3
